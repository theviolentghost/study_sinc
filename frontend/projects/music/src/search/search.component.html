<!-- <div class="backdrop" [style.--primary]="get_search_primary_color()" [ngClass]="{ 'extra-space': catalog.length > 0 }"></div> -->
<div class="search-container">
    <button class="quick-action" [style.--mask]="'url(' + (search_history_length === 0 ? 'search.svg' : 'chevron-left.svg') + ')'" (click)="left_quick_action_click()"></button>
    <input #searchInput id="search" type="text" [(ngModel)]="search_query" placeholder="Search" (keydown.enter)="search()" autocomplete="off" (ngModelChange)="on_search_input_change()"/>
    <button class="quick-action hidden" [style.--mask]="'url(\'x.svg\')'" [ngClass]="{hidden: search_query.length === 0}" (click)="clear_input()"></button>
    <button class="quick-action" [style.--mask]="'url(\'brand-' + search_source + '.svg\')'" style="mask-size: 90%;" (click)="toggle_source_dropdown()">
        <div class="drop-down-indicator" [style.--mask]="'url(\'chevron-down.svg\')'"></div>
        <div class="drop-down-options" [ngClass]="{hidden: !source_dropdown_open}">
            <button class="option" *ngFor="let option of source_dropdown_options" [style.--mask]="'url(\'brand-' + option.source + '.svg\')'" [style.background-color]="option.color" (click)="select_source(option.source); $event.stopPropagation();"></button>
        </div>
    </button>
    <div class="search-recommendations" *ngIf="search_recommendations.length > 0">
        <div 
            class="recommendation"
            *ngFor="let recommendation of search_recommendations"
                (click)="search(recommendation.text)"
                (touchend)="search(recommendation.text)"
        >
            <span *ngFor="let run of recommendation.runs" [ngClass]="{bold: run.bold}">{{run?.text}}</span>
        </div>
    </div>
</div>

<div class="search-results">
    <div class="search-filter" *ngIf="search_source == 'spotify'" [ngClass]="{visible: search_results?.catalog?.length > 0}">
        <button class="filter clear" [style.--mask]="'url(\'x.svg\')'" [ngClass]="{visible: search_filter !== 'all'}" (click)="select_filter('all')"></button>
        <button class="filter" (click)="select_filter('tracks')" [ngClass]="{active: search_filter === 'tracks'}">Tracks</button>
        <button class="filter" (click)="select_filter('artists')" [ngClass]="{active: search_filter === 'artists'}">Artists</button>
        <button class="filter" (click)="select_filter('albums')" [ngClass]="{active: search_filter === 'albums'}">Albums</button>
        <button class="filter" (click)="select_filter('playlists')" [ngClass]="{active: search_filter === 'playlists'}">Playlists</button>
    </div>
    <div class="search-results-main">
        <div class="backdrop" [style.--primary]="get_search_primary_color()" [ngClass]="{ 'extra-space': catalog.length > 0 }"></div>
        <ng-container [ngSwitch]="search_source">
            <!-- YOUTUBE TEMPLATE -->
            <ng-container *ngSwitchCase="'youtube'">
                <!-- Artists -->
                <div *ngIf="(search_results?.artists?.total || 0) > 0" class="search-results-artists">
                    <div class="search-result artist disable-select" *ngFor="let artist of artist_results">
                        <div class="thumbnail">
                            <img [src]="artist.snippet.thumbnails.default.url" alt="" />
                        </div>
                        <a class="name">{{ artist.snippet.title }}</a>
                    </div>
                </div>
                <!-- Videos -->
                <ng-container *ngIf="(search_results?.videos?.total || 0) > 0; else noResults">
                    <div class="search-results-videos hide-scrollbar">
                        <button (click)="youtube_play(video)" class="search-result video disable-select" *ngFor="let video of search_results?.videos?.results" [ngClass]="{saved: is_song_in_collection(video, 'youtube'), selected: get_bare_song_key(current_song_identifier) === get_bare_song_key(get_video_identifier(video, 'youtube'))}" >
                            <div class="thumbnail">
                                <img [src]="video.snippet.thumbnails.default.url" alt="" />
                                <div class="duration">00:00:00</div>
                            </div>
                            <div class="info">
                                <div class="title">{{ video.snippet.title }}</div>
                                <div class="artist">{{ video.snippet.channelTitle }}</div>
                            </div>
                            <!-- <button class="hot-action" [style.--mask]="'url(\'plus.svg\')'" (click)="open_hot_action(video, 'youtube'); $event.stopPropagation();">
                                <div *ngIf="is_song_in_collection(video, 'youtube')" class="saved-indicator" [style.--mask]="'url(\'check.svg\')'"></div>
                            </button> -->
                            <button class="hot-action" [style.--mask]="'url(\'' + (is_song_in_collection(video, 'youtube') ? 'check.svg' : 'plus.svg') + '\')'" (click)="open_hot_action(video, 'youtube'); $event.stopPropagation();">
                                <!-- <div *ngIf="is_song_in_collection(track, 'spotify')" class="saved-indicator" [style.--mask]="'url(\'check.svg\')'"></div> -->
                            </button>
                        </button>
                    </div>
                </ng-container>
            </ng-container>

            <!-- SPOTIFY TEMPLATE -->
            <ng-container *ngSwitchCase="'spotify'">
                <!-- Artists -->
                <!-- <div *ngIf="(search_results?.artists?.total || 0) > 0" class="search-results-artists">
                    <div class="search-result artist disable-select" *ngFor="let artist of artist_results">
                        <div class="thumbnail">
                            <img [src]="artist.images?.[0]?.url || 'users.svg'" alt="" />
                        </div>
                        <a class="name">{{ artist.name }}</a>
                    </div>
                </div> -->
                <!-- Albums -->
                <!-- <div *ngIf="(search_results?.albums?.total || 0) > 0" class="search-results-albums">
                    <div class="search-result album disable-select" *ngFor="let album of search_results?.albums?.items">
                        <div class="thumbnail">
                            <img [src]="album.images?.[0]?.url || 'default-album.svg'" alt="" />
                        </div>
                        <div class="info">
                            <div class="title">{{ album.name }}</div>
                            <div class="artist">{{ album.artists?.[0]?.name }}</div>
                        </div>
                    </div>
                </div> -->
                <!-- Tracks -->
                <!-- <div *ngIf="(catalog?.length || 0) > 0" class="search-results-videos hide-scrollbar"> -->
                    <!-- <button (click)="spotify_play(track)" class="search-result video disable-select" *ngFor="let track of search_results?.tracks?.items" [ngClass]="{saved: is_song_in_collection(track, 'spotify'), selected: get_bare_song_key(current_song_identifier) === get_bare_song_key(get_video_identifier(track, 'spotify'))}">
                        <div class="thumbnail">
                            <img [src]="track.album?.images?.[2]?.url || 'music.svg'" alt="" />
                            <div class="duration">{{ ms_to_time(track.duration_ms) }}</div>
                        </div>
                        <div class="info">
                            <div class="title">{{ track.name }}</div>
                            <div class="artist">{{ track.artists?.[0]?.name }}</div>
                        </div>
                        <div class="extra-info-alignment">
                            <button class="hot-action" [style.--mask]="'url(\'' + (is_song_in_collection(track, 'spotify') ? 'check.svg' : 'plus.svg') + '\')'" (click)="open_hot_action(track, 'spotify'); $event.stopPropagation();"></button>
                        </div>
                    </button> -->
                    <div class="search-background">
                        <ng-container *ngFor="let item of catalog">
                            <ng-container [ngSwitch]="item?.type">
                                <button
                                    *ngSwitchCase="'track'"
                                    (click)="spotify_play(item)"
                                    class="search-result video disable-select"
                                    [ngClass]="{
                                        saved: is_song_in_collection(item, 'spotify'),
                                        selected: get_bare_song_key(current_song_identifier) === get_bare_song_key(get_video_identifier(item, 'spotify'))
                                    }"
                                >
                                    <div class="thumbnail">
                                        <img [src]="item?.album?.images?.[1]?.url || 'music.svg'" alt="Track cover" />
                                        <div class="duration">{{ ms_to_time(item?.duration_ms) }}</div>
                                    </div>
                                    <div class="info">
                                        <div class="title">{{ item?.name }}</div>
                                        <div class="artist">{{ item?.artists?.[0]?.name }}</div>
                                    </div>
                                    <div class="extra-info-alignment">
                                        <button class="hot-action" [style.--mask]="'url(\'' + (is_song_in_collection(item, 'spotify') ? 'check.svg' : 'plus.svg') + '\')'" (click)="open_hot_action(item, 'spotify'); $event.stopPropagation();"></button>
                                    </div>
                                </button>

                                <button
                                    *ngSwitchCase="'artist'"
                                    (click)="spotify_open_artist(item)"
                                    class="search-result artist disable-select"
                                    [ngClass]="{
                                        following: false,
                                    }"
                                >
                                    <div class="thumbnail">
                                        <img [src]="item?.images?.[1]?.url || 'music.svg'" alt="Artist image" />
                                    </div>
                                    <div class="info">
                                        <div class="title">{{ item?.name }}</div>
                                        <div class="followers">{{ format_followrs(item?.followers?.total) }} <span style="filter: brightness(.8);">Followers</span></div>
                                    </div>
                                    <div class="extra-info-alignment">
                                        <button class="following" [style.--mask]="'url(\'' + (is_following_artist(item?.id) ? 'bookmark-fill.svg' : 'bookmark.svg') + '\')'" (click)="toggle_follow_artist(item); $event.stopPropagation();"></button>
                                    </div>
                                </button>

                                <!-- Debug fallback for unknown types -->
                                <div *ngSwitchDefault class="debug-item">
                                    <p>Unknown type: {{ item?.type }} - {{ item?.name }}</p>
                                </div>
                            </ng-container>
                        </ng-container>
                    </div>
                <!-- </div> -->
            </ng-container>

            <!-- FUTURE SOURCES TEMPLATE -->
            <ng-container *ngSwitchDefault>
                <div class="no-results">
                    <div class="icon" [style.mask-image]="'url(\'search.svg\')'"></div>
                    <div class="message">No results found or source not supported.</div>
                </div>
            </ng-container>
        </ng-container>

        <!-- No Results Template -->
        <ng-template #noResults>
            <div class="no-results" *ngIf="search_query.length > 0 && searched">
                <div class="icon" [style.mask-image]="'url(\'search.svg\')'"></div>
                <div class="message">No results found</div>
            </div>
        </ng-template>
    </div>
</div>

<div class="search-recommendations">
    
</div>
