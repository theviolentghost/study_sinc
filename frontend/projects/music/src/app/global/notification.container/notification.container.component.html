<div class="notification-container">
    <div 
        *ngFor="let notification of notifications; trackBy: trackById; let i = index"
        [class]="getNotificationClass(notification.type)"
        (click)="onNotificationClick(notification)"
        [@notificationAnimation]
    >
        <!-- Main notification content -->
        <div class="notification-content">
            <!-- Icon -->
            <div class="notification-icon"
                [style.--mask] = "'url(' + (notification.icon ?? get_notification_icon_url(notification.type)) + ')'"
                [style.--color-icon]="get_notification_icon_color(notification.type)"
            >
                <!-- <ng-container [ngSwitch]="notification.type">
                    <svg *ngSwitchCase="'info'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <svg *ngSwitchCase="'warning'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <svg *ngSwitchCase="'error'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                </ng-container> -->
            </div>

            <!-- Message -->
            <div class="notification-message">
                <div class="message-header">
                    <span class="message-text">{{ notification.message }}</span>
                    <span class="message-details">{{ notification.details }}</span>
                </div>

                <!-- Stack count -->
                <span *ngIf="notification.stackCount > 1" class="stack-count">
                    x{{ notification.stackCount }}
                </span>
            </div>
        </div>

        <!-- Expanded stacked messages -->
        <!-- <div *ngIf="notification.stackCount > 1 && isExpanded(notification.id)" class="stacked-messages">
            <div 
                *ngFor="let msg of notification.stackedMessages; let i = index" 
                class="stacked-message"
            >
                <span class="message-index">{{ i + 1 }}.</span>
                <span>{{ msg }}</span>
            </div>
        </div> -->

        <!-- Action buttons -->
        <div *ngIf="notification.actions && notification.actions.length > 0" class="notification-actions">
            <button 
                *ngFor="let action of notification.actions"
                class="action-button"
                (click)="onActionClick(action, notification, $event)"
            >
                {{ action.label }}
                <div *ngIf="action?.icon" class="action-icon" [style.--mask]="'url(' + action.icon + ')'"></div>
            </button>
        </div>
    </div>
</div>
