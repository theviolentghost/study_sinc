<div class="settings-wrapper">
    <!-- Genre list -->
    <div class="genre-list" *ngIf="!selectedGenre">
        <div class="profile">
            <div class="avater">
                <img src="users.svg" alt="User Avatar">
            </div>
            <div style="display: flex; flex-direction: column; justify-content: center;">
                <div class="display-name">#display name</div>
                <div class="identifier">#identifier</div>
            </div>
        </div>

        <div class="setting-genre-container">
            <div 
                class="setting-genre"
                *ngFor="let genre of genres"
                (click)="open_genre_setting(genre);"
            >
                <div class="label">{{ genre.label }}</div>
                <div class="chevron" [style.--mask]="'url(' + 'chevron-left.svg' + ')' "></div>
            </div>
        </div>
    </div>

    <!-- Settings panel for selected genre -->
    <div class="settings-panel" *ngIf="selectedGenre">
        <div class="close" (click)="back_to_genres()" [style.--mask]="'url(\'chevron-left.svg\')'"></div>
        <div class="panel-header">
            <!-- <button class="back" (click)="back_to_genres()">← Back</button> -->
            <h2>{{ selectedGenre }}</h2>
        </div>

        <div class="settings-list">
            <ng-container *ngFor="let s of currentSettings">
                <div *ngIf="!s.hidden" class="setting-row" [class.disabled]="isSettingDisabled(s)">
                    <div class="setting-main">
                        <div class="label">{{ s.label }}</div>
                        <div class="control">
                            <ng-container [ngSwitch]="s.type">
                                <ng-container *ngSwitchCase="'toggle'">
                                    <label class="switch">
                                        <input type="checkbox" [checked]="!!s.value" (change)="onSettingChange(s, $any($event.target).checked)" [disabled]="isSettingDisabled(s)" />
                                        <span class="slider"></span>
                                    </label>
                                </ng-container>
                                <ng-container *ngSwitchCase="'dropdown'">
                                    <div class="custom-dropdown" [class.expanded]="isDropdownExpanded(s.id)">
                                        <button 
                                            class="dropdown-trigger" 
                                            (click)="toggleDropdown(s.id)"
                                            [disabled]="isSettingDisabled(s)"
                                        >
                                            <span class="selected-label">{{ getDropdownLabel(s) }}</span>
                                            <span class="dropdown-arrow">▼</span>
                                        </button>
                                    </div>
                                </ng-container>
                                <ng-container *ngSwitchCase="'info'">
                                    <div class="info-value">{{ s.value }}</div>
                                </ng-container>
                            </ng-container>
                        </div>
                    </div>

                    <!-- Dropdown options list (shown when expanded) -->
                    <div class="dropdown-options" *ngIf="s.type === 'dropdown' && isDropdownExpanded(s.id)">
                        <div 
                            class="dropdown-option"
                            *ngFor="let option of s.options; let i = index"
                            (click)="selectDropdownOption(s, option, i)"
                            [class.selected]="option.value === s.value"
                        >
                            <span class="option-label">{{ option.label }}</span>
                            <span class="checkmark" *ngIf="option.value === s.value">✓</span>
                        </div>
                    </div>

                    <!-- Notes section (supports multiple notes with different severity levels) -->
                    <div class="notes-container" *ngIf="getSettingNotes(s).length > 0">
                        <div class="note" *ngFor="let note of getSettingNotes(s)" [class.warning]="note.severity === 'warning'" [class.info]="note.severity === 'info'">
                            <span class="note-text">
                                {{ note.text }}
                            </span>
                        </div>
                    </div>
                </div>
            </ng-container>

            <div *ngIf="currentSettings.length === 0" class="empty">No settings available for this category.</div>
        </div>
    </div>
</div>
